<!doctype html>
<html lang="zh-CN" class="govuk-template">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>设施研判工作台 - 城市设施服务站</title>
    <link rel="stylesheet" href="/vendor/govuk/govuk-frontend.min.css" />
    <link rel="stylesheet" href="/vendor/moj/moj-frontend.min.css" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body class="govuk-template__body">
    <script src="/supported.js"></script>
    <a href="#main-content" class="govuk-skip-link" data-module="govuk-skip-link"
      >跳到正文</a
    >
    <header class="govuk-template__header">
      <div class="govuk-generic-header">
        <div
          class="govuk-generic-header__container govuk-width-container app-width-container--wide"
        >
          <div class="govuk-generic-header__logo">
            <a href="/admin" class="govuk-generic-header__homepage-link"
              >城市设施服务站</a
            >
          </div>
        </div>
      </div>
      <section
        aria-label="服务名称"
        class="govuk-service-navigation"
        data-module="govuk-service-navigation"
      >
        <div class="govuk-width-container app-width-container--wide">
          <div class="govuk-service-navigation__container">
            <span class="govuk-service-navigation__service-name">
              <a href="#/" class="govuk-service-navigation__link"
                >设施研判工作台</a
              >
            </span>
            <nav
              aria-label="工作台导航"
              class="govuk-service-navigation__wrapper"
              id="nav"
              hidden
            >
              <button
                type="button"
                class="govuk-service-navigation__toggle govuk-js-service-navigation-toggle"
                aria-controls="navigation"
                hidden
                aria-hidden="true"
              >
                菜单
              </button>
              <ul class="govuk-service-navigation__list" id="navigation">
                <li class="govuk-service-navigation__item">
                  <a
                    class="govuk-service-navigation__link"
                    href="#/"
                    data-nav="queue"
                    data-label="事件队列"
                    >事件队列</a
                  >
                </li>
                <li class="govuk-service-navigation__item">
                  <a
                    class="govuk-service-navigation__link"
                    href="#/briefs"
                    data-nav="briefs"
                    data-label="简报收件箱"
                    >简报收件箱</a
                  >
                </li>
                <li
                  class="govuk-service-navigation__item app-service-navigation__action"
                >
                  <button type="button" id="logout" class="app-link-button">
                    退出登录
                  </button>
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </section>
    </header>
    <div class="govuk-width-container app-width-container--wide">
      <main class="govuk-main-wrapper" id="main-content">
        <div id="app"></div>
      </main>
    </div>
    <script type="module" src="/admin.js"></script>
  </body>
</html>
